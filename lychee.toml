# Settings of the weekly check of the documentation's external links (.github/workflows/links.yml).

# Some sites answer a robot with 403 or 429 while the page is fine for a person; the intra answers 302 to its
# sign-in page.
accept = [200, 204, 206, 301, 302, 403, 429]
max_retries = 3
retry_wait_time = 5
timeout = 20
user_agent = "Mozilla/5.0 (compatible; BDE_Network link checker)"

# Examples, not links: addresses of a BDE that does not exist, a localhost, a page that needs a GitHub sign-in.
exclude = [
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  '^https?://0\.0\.0\.0',
  '^https?://([a-z0-9-]+\.)?(example|exemple)\.(org|com|fr)',
  'your-domain\.example',
  'votre-domaine\.example',
  'bde\.my-school\.org',
  'bde\.mon-ecole\.fr',
  '/security/advisories/new$',
  '^https://api\.slack\.com/apps\?new_app',
  '^https://github\.com/<',
]

exclude_path = ['node_modules', 'src/generated', '.next', '.audit']
