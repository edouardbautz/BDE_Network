# Contributor dev environment: runs `next dev` inside a container with the
# source bind-mounted for hot reload, so you don't need Node installed on
# your machine. Usage: docker compose -f docker-compose.dev.yml up
#
# The app service pushes the Prisma schema and seeds demo accounts
# (demo-owner, demo-admin, demo-president, demo-secretary, demo-member1/2, demo-pending, with
# their roles) on every startup — both steps are idempotent (upsert / count-gated), so
# this stays a single command whether the volume is fresh or already has data.
# `--accept-data-loss` is needed because Prisma refuses, non-interactively, to
# add a unique index to an existing table; this is a throwaway dev database.
# Production uses `prisma migrate deploy` instead (see the Dockerfile).
#
# E-mails never leave your machine: the app sends them to Mailpit, a catch-all test mailbox, and you
# read them on http://localhost:8025 (docs/notifications.md). To send through a real server instead, set
# DEV_SMTP_HOST (and DEV_SMTP_PORT, DEV_SMTP_FROM, DEV_SMTP_USER, DEV_SMTP_PASSWORD) in .env.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      # The mailbox, in the browser (8025), and SMTP (1025) for `npm run dev` outside Docker.
      # Inside Docker the app reaches it as `mailpit:1025` on the compose network.
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

  app:
    image: node:26-alpine
    working_dir: /app
    # `--no-save`: install what package-lock.json says and never write it back. A plain `npm install`
    # rewrites the lock with the container's npm (it reorders fields), which dirtied the working tree on
    # every start. (`npm ci` is the CI's job: it deletes node_modules, which is a mount point here.)
    command: sh -c "npm install --no-save && npx prisma generate && npx prisma db push --accept-data-loss && npm run seed:demo && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Docker Desktop on Windows doesn't always propagate native filesystem
      # change events through bind mounts — polling makes hot reload reliable
      # there at the cost of a bit of CPU. Harmless on Linux/macOS.
      WATCHPACK_POLLING: 'true'
      # E-mail: Mailpit unless .env says otherwise (these take precedence over the SMTP_* of .env).
      SMTP_HOST: ${DEV_SMTP_HOST:-mailpit}
      SMTP_PORT: ${DEV_SMTP_PORT:-1025}
      SMTP_FROM: ${DEV_SMTP_FROM:-BDE Dev <bde@localhost>}
      SMTP_USER: ${DEV_SMTP_USER:-}
      SMTP_PASSWORD: ${DEV_SMTP_PASSWORD:-}
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
      - next_cache_dev:/app/.next

volumes:
  postgres_data_dev:
  node_modules_dev:
  next_cache_dev:
