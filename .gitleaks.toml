title = "BDE_Network"

[extend]
useDefault = true

# The tests write fake secrets (a client secret, a password) to check that they are sealed, hidden or refused. Only the
# generic "looks like a key" rule is relaxed, and only in test files: a real token of a known service (a GitHub token,
# a Discord webhook...) is still found everywhere, tests included.
[[allowlists]]
description = "Fake secrets written by the tests"
targetRules = ["generic-api-key"]
paths = ['''.*\.test\.tsx?$''']

# The self-test of this very configuration writes fake secrets (a first version wrote them whole, and that commit is in the
# history); it now builds them at run time. Only this file, and only for what it writes on purpose.
[[allowlists]]
description = "The self-test of the gitleaks configuration"
paths = ['''qa-rules/gitleaks-selftest\.sh''']

# The tests and the quality suites need a Discord user id of the right shape (17 to 20 digits) to check that it is read, stored and
# erased. An id is public by design (it is what a mention of an account is made of), the rule takes it for a client id because the
# word Discord is next to it, and this one is the fake the tests share: only this value, only for that rule.
[[allowlists]]
description = "The fake Discord user id of the tests"
targetRules = ["discord-client-id"]
regexes = ['''348291047563210241''']
