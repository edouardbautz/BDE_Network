services:
  # Makes the password of the database, once, in the `secrets` volume: nobody has to choose or write it. An
  # installation that already has a POSTGRES_PASSWORD in its .env keeps it (the database exists with it). Then it
  # stops: the other services wait for it to have finished. The postgres image is reused (nothing more to pull).
  secrets:
    image: postgres:17-alpine
    restart: 'no'
    user: root
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - secrets:/secrets
    entrypoint: ['sh', '-c']
    command:
      - |
        set -eu
        umask 077
        file=/secrets/postgres_password
        if [ ! -s "$$file" ]; then
          if [ -n "$$POSTGRES_PASSWORD" ]; then
            printf '%s' "$$POSTGRES_PASSWORD" > "$$file"
          else
            head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32 > "$$file"
          fi
        fi
        # The application (uid 1001 of its image) keeps its own keys in the same volume.
        chown 1001:1001 /secrets "$$file"
        chmod 700 /secrets
        chmod 600 "$$file"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bde}
      POSTGRES_DB: ${POSTGRES_DB:-bde_network}
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - secrets:/secrets:ro
    # No published port: only the app (same compose network) reaches the database. To look at it
    # from the server: `docker compose exec postgres psql -U "$POSTGRES_USER" "$POSTGRES_DB"`.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # The image published for each release (.github/workflows/release.yml): the version is written HERE, so a
    # `git pull` followed by `docker compose up -d` is the whole update, and going back to an older version of this
    # folder goes back to its image. Never `latest`: what runs must be what this file was written for.
    # To pin another version, or to build the image from this folder (contributors, a files-driven installation):
    # docker-compose.build.yml, see docs/en/deployment.md.
    image: ghcr.io/edouardbautz/bde_network:${BDE_VERSION:-1.1.1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # No `env_file`, on purpose: the platform works without a .env (it creates its own keys, and will be
    # configured from the browser). What an installation that already has a .env needs from it is passed here,
    # by name; docker compose reads .env itself when it exists and does not mind when it does not. These values
    # are read once, at the first start after an update, to be copied into the database (src/lib/settings).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bde}
      POSTGRES_DB: ${POSTGRES_DB:-bde_network}
      # Left empty on purpose: it overrides a DATABASE_URL of .env (which is for `npm run dev`), and the container
      # builds the address itself from POSTGRES_USER, POSTGRES_DB and the password of the `secrets` volume,
      # encoding them. Written here, a password with @ / : ? # cut the address in the wrong place (and Prisma
      # printed bits of it in the logs).
      DATABASE_URL: ''
      AUTH_SECRET: ${AUTH_SECRET:-}
      APP_URL: ${APP_URL:-}
      FORTYTWO_CLIENT_ID: ${FORTYTWO_CLIENT_ID:-}
      FORTYTWO_CLIENT_SECRET: ${FORTYTWO_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      BDE_REIMPORT: ${BDE_REIMPORT:-}
      # What this file gives the image (its variables, its volumes), as a number: the image refuses to start with
      # a message, not a loop, when the file and the image do not belong together (docker/safe-update.mjs).
      BDE_STACK: '2'
      # Applies the migrations without the copy that is made before them, when that copy cannot be made (a full disk).
      BDE_SKIP_BACKUP: ${BDE_SKIP_BACKUP:-}
      # Only to write the right address in the installer's code box (the container does not know it).
      BDE_HOST_PORT: ${APP_PORT:-3000}
    ports:
      # Reachable from this machine only (a reverse proxy in front handles HTTPS).
      # Without a proxy, set APP_BIND=0.0.0.0 in .env: read the warning in docs/deployment.md first.
      # Another program already uses port 3000? Set APP_PORT=3001 (any free port) in .env.
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'
    volumes:
      # The keys of the platform (session secret, key that seals the secret settings). BACK THIS VOLUME UP
      # (scripts/backup.sh does): without it, the secrets of a restored database cannot be decrypted.
      - secrets:/secrets
      # The logo the owner uploaded. scripts/backup.sh puts it in the database archive.
      - uploads:/uploads
      # The copies of the database made automatically before an update (the newest five, nothing older than 90 days).
      # `./scripts/restore.sh --pre-update` puts one back.
      - backups:/backups
    # No bind mount of bde.config.yml, on purpose. A mount is resolved by the Docker daemon, on ITS
    # side, and a daemon that cannot see this folder (rootless Docker, a remote daemon, a home on a
    # network share) answers by creating an EMPTY DIRECTORY there, or the application cannot read the
    # file. bde.config.yml travels with the build instead (the Dockerfile copies it from the build
    # context, which the docker client always sends itself).

volumes:
  postgres_data:
  secrets:
  uploads:
  backups:
