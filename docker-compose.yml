services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: only the app (same compose network) reaches the database. To look at it
    # from the server: `docker compose exec postgres psql -U "$POSTGRES_USER" "$POSTGRES_DB"`.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    ports:
      # Reachable from this machine only (a reverse proxy in front handles HTTPS).
      # Without a proxy, set APP_BIND=0.0.0.0 in .env: read the warning in docs/deployment.md first.
      # Another program already uses port 3000? Set APP_PORT=3001 (any free port) in .env.
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'
    # No bind mount of bde.config.yml, on purpose. A mount is resolved by the Docker daemon, on ITS
    # side, and a daemon that cannot see this folder (rootless Docker, a remote daemon, a home on a
    # network share) answers by creating an EMPTY DIRECTORY there: the app then found a directory
    # where its configuration should be. The configuration travels with the build instead (the
    # Dockerfile copies it from the build context, which the docker client always sends itself).
    # After editing bde.config.yml: `docker compose up -d --build`.

volumes:
  postgres_data:
