services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    ports:
      # Reachable from this machine only (a reverse proxy in front handles HTTPS).
      # Without a proxy, set APP_BIND=0.0.0.0 in .env: read the warning in docs/deployment.md first.
      - '${APP_BIND:-127.0.0.1}:3000:3000'
    volumes:
      - ./bde.config.yml:/app/bde.config.yml:ro
      - storage_uploads:/app/storage/uploads

volumes:
  postgres_data:
  storage_uploads:
