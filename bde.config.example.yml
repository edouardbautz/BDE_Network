# Configuration du BDE — ce fichier est versionné avec le code (contrairement
# à .env, qui contient les secrets). Copiez-le vers bde.config.yml puis
# adaptez chaque valeur à votre bureau.
#
# Le fichier est validé au démarrage de l'application : si une valeur est
# manquante ou mal formée, l'application refuse de démarrer et affiche un
# message expliquant quoi corriger.

bde:
  # Nom affiché dans l'interface (titre, page de connexion, emails).
  name: 'BDE Exemple'

  # Campus principal du bureau (affichage uniquement).
  campus: 'Paris'

  # Fuseau horaire IANA utilisé pour l'affichage des dates.
  timezone: 'Europe/Paris'

  # Langue des messages envoyés par la plateforme (e-mails, Discord, Slack) :
  # "fr" ou "en". Elle ne change pas la langue de l'interface, que chaque
  # membre choisit par l'adresse (/fr/... ou /en/...).
  defaultLocale: 'fr'

  # Couleur d'accent de l'interface, au format hexadécimal.
  accentColor: '#0f766e'

  # Chemin du logo, servi depuis le dossier /public (donc en commençant par "/").
  logoPath: '/logo.svg'

  # Facultatif : l'adresse e-mail où les membres peuvent écrire à propos de leurs
  # données (affichée sur la page de confidentialité).
  # contactEmail: 'bureau@exemple.fr'

auth:
  # Logins 42 des propriétaires (OWNER). Un login listé ici obtient
  # automatiquement le rôle OWNER à sa première connexion, sans validation.
  # Ce rôle ne peut être changé QUE depuis ce fichier, jamais depuis l'interface.
  owners:
    - 'votre-login-42'

  # Campus 42 autorisés à se connecter à la plateforme. Toute personne dont
  # le campus 42 n'est pas dans cette liste est refusée à la connexion.
  # La comparaison ignore la casse et les espaces superflus.
  # Liste vide ([]) = aucun filtre : tous les campus sont autorisés.
  allowedCampuses:
    - 'Paris'

modules:
  # Clés des modules métier activés pour ce BDE.
  # Modules disponibles : "events" (calendrier des événements du bureau).
  # Exemple : ["events"]
  enabled: []

# Requis uniquement si le module "events" est activé ci-dessus.
# events:
#   # Catégories proposées lors de la création d'un événement. `key` est un
#   # identifiant stable (minuscules, chiffres, tirets) : ne le changez pas une
#   # fois des événements créés. `label` est affiché tel quel, `color` colore
#   # l'événement dans le calendrier (hexadécimal).
#   categories:
#     - { key: 'soiree', label: 'Soirée', color: '#db2777' }
#     - { key: 'sport', label: 'Sport', color: '#16a34a' }
#     - { key: 'wei', label: 'WEI', color: '#ea580c' }
#     - { key: 'partenariat', label: 'Partenariat', color: '#2563eb' }
#   # Heure locale (fuseau `bde.timezone`) du rappel envoyé la veille d'un
#   # événement, entre 0 et 23. Défaut : 18.
#   reminderHour: 18

notifications:
  # Canal utilisé pour chaque type de notification : "email", "discord",
  # "slack" ou "none". Le canal choisi doit être configuré dans .env
  # (SMTP_*, DISCORD_WEBHOOK_URL ou SLACK_WEBHOOK_URL) pour fonctionner.
  # Notifications sur les membres (voir docs/configuration.md) :
  memberPending: 'none' # une demande d'accès attend : prévient les propriétaires et ceux qui peuvent la valider
  memberApproved: 'none' # une demande est approuvée : e-mail au membre, ou message dans le salon
  memberRemoved: 'none' # un membre est retiré : message dans le salon (discord ou slack), jamais d'e-mail
  # Module "events" (ignorés si le module n'est pas activé). Optionnels : "none" par défaut.
  eventConfirmed: 'none' # un événement passe de brouillon à confirmé
  eventReminder: 'none' # rappel envoyé la veille d'un événement
