# Configuration du BDE — ce fichier est versionné avec le code (contrairement
# à .env, qui contient les secrets).
#
# Une plateforme installée depuis le navigateur n'en a pas besoin : ses réglages sont dans sa base de données et
# se modifient dans la page Paramètres. Ce fichier ne sert qu'à une installation par fichiers, à l'import du
# premier démarrage, ou quand BDE_REIMPORT=1 (voir docs/fr/configuration.md). Copiez-le vers bde.config.yml puis
# adaptez chaque valeur à votre bureau.
#
# Le fichier est validé au démarrage de l'application : si une valeur est
# manquante ou mal formée, l'application refuse de démarrer et affiche un
# message expliquant quoi corriger.

bde:
  # Nom affiché dans l'interface (titre, page de connexion, emails).
  name: 'BDE Exemple'

  # Campus principal du bureau (affichage uniquement).
  campus: 'Paris'

  # Fuseau horaire IANA utilisé pour l'affichage des dates.
  timezone: 'Europe/Paris'

  # Langue des messages envoyés par la plateforme (e-mails, Discord, Slack) :
  # "fr" ou "en". Elle ne change pas la langue de l'interface, que chaque
  # membre choisit par l'adresse (/fr/... ou /en/...).
  defaultLocale: 'fr'

  # Couleur d'accent de l'interface, au format hexadécimal.
  accentColor: '#2F5BEA'

  # Chemin du logo, servi depuis le dossier /public (donc en commençant par "/").
  logoPath: '/logo.svg'

  # Facultatif : l'adresse e-mail où les membres peuvent écrire à propos de leurs
  # données (affichée sur la page de confidentialité).
  # contactEmail: 'bureau@exemple.fr'

auth:
  # Logins 42 des propriétaires (OWNER). Un login listé ici obtient
  # automatiquement le rôle OWNER à sa première connexion, sans validation.
  # Une fois la plateforme installée, cette liste se gère dans Paramètres, section Propriétaires (jamais depuis
  # les pages Membres ou Rôles).
  owners:
    - 'votre-login-42'

  # Campus 42 autorisés à se connecter à la plateforme. Toute personne dont
  # le campus 42 n'est pas dans cette liste est refusée à la connexion.
  # La comparaison ignore la casse et les espaces superflus.
  # Liste vide ([]) = aucun filtre : tous les campus sont autorisés.
  allowedCampuses:
    - 'Paris'

modules:
  # Clés des modules métier activés pour ce BDE.
  # Modules disponibles : "events" (calendrier des événements du bureau).
  # Exemple : ["events"]
  enabled: []

# Requis uniquement si le module "events" est activé ci-dessus.
# events:
#   # Catégories proposées lors de la création d'un événement. `key` est un
#   # identifiant stable (minuscules, chiffres, tirets) : ne le changez pas une
#   # fois des événements créés. `label` est affiché tel quel, `color` colore
#   # l'événement dans le calendrier (hexadécimal).
#   categories:
#     - { key: 'soiree', label: 'Soirée', color: '#db2777' }
#     - { key: 'sport', label: 'Sport', color: '#16a34a' }
#     - { key: 'wei', label: 'WEI', color: '#ea580c' }
#     - { key: 'partenariat', label: 'Partenariat', color: '#2563eb' }
#   # Heure locale (fuseau `bde.timezone`) du rappel envoyé la veille d'un
#   # événement, entre 0 et 23. Défaut : 18.
#   reminderHour: 18

notifications:
  # Par où part chaque type de notification : une liste de canaux, parmi "discord", "slack" et "email" (plusieurs à
  # la fois, par exemple [discord, email]). Une liste vide, [], n'envoie rien. Chaque canal choisi doit être configuré
  # dans .env (DISCORD_WEBHOOK_URL, SLACK_WEBHOOK_URL ou SMTP_*) pour fonctionner. Les canaux sont indépendants : si
  # l'un est en panne, les autres envoient quand même. Avant la version 1.5.0 on écrivait un seul canal ('discord')
  # ou 'none' : cette forme est toujours lue. Se règle aussi dans Paramètres, sous forme de tableau.
  # Notifications sur les membres (voir docs/fr/configuration.md) :
  memberPending: [] # une demande d'accès attend : prévient les propriétaires et ceux qui peuvent la valider
  memberApproved: [] # une demande est approuvée : e-mail au membre, et message dans le salon (discord, slack)
  memberRemoved: [] # un membre est retiré : message dans le salon (discord, slack), jamais d'e-mail
  # Module "events" (ignorés si le module n'est pas activé). Optionnels : [] par défaut.
  eventConfirmed: [] # un événement passe de brouillon à confirmé
  eventReminder: [] # rappel envoyé la veille d'un événement
  eventProposed: [] # un événement est proposé : prévient ceux qui peuvent le valider
  eventApproved: [] # une proposition est approuvée : e-mail à son auteur, et message dans le salon
  eventRefused: [] # une proposition est refusée, avec le commentaire : e-mail à son auteur, et message dans le salon


# Facultatif. Prévenir les propriétaires (bandeau du tableau de bord et de la page Paramètres) quand une nouvelle
# version de la plateforme est publiée. La plateforme demande alors la dernière version à GitHub, sans rien envoyer
# de votre BDE (voir docs/fr/configuration.md). Défaut : true. Se règle aussi dans Paramètres.
# updates:
#   check: true
