name: qa

# The quality campaign (see "Quality campaign" in docs/architecture.md). Three levels of CI:
#
#   - every pull request: ci.yml, fast and deterministic, what makes a change safe to merge;
#   - this workflow, every night and on demand (Actions → qa → Run workflow): the heavy suites, played on the real image,
#     a real PostgreSQL and the QA dataset;
#   - a release: the last run of this workflow on the commit to tag must be green.
#
# A pull request can ask for it too: put the label `full-qa` on it (typically a change to the security headers, the
# access rules, the migrations, or the harness itself). It is NOT required to merge: it is for changes that deserve it
# (but a pull request that carries the label is merged only once it is green, like any other job).

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Is a platform made by qa/platform.sh up, does it tell the personas apart, does its database hold the invariants.
  # Every later suite starts from this platform.
  baseline:
    name: baseline and access matrix (${{ matrix.variant }})
    # A pull request runs it only when it carries the label.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-qa')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [events-enabled, events-disabled]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The image of the pull request or of main, built once for both variants (the second finds it in the cache).
      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: bde-network
          cache-from: type=gha,scope=qa-image
          cache-to: type=gha,mode=max,scope=qa-image

      - name: Start the platform with the QA dataset
        run: sh qa/platform.sh up --image bde-network --variant "${{ matrix.variant }}"

      - name: Smoke test, and the invariants of the database
        run: |
          eval "$(sh qa/platform.sh env)"
          npx tsx qa/smoke.ts

      # Every page, API route and server action, as every persona (visitor, pending, member, proposer, validator, custom
      # role, Admin, owner, removed member), with the events module on and off: see "Access matrix" in docs/architecture.md.
      - name: Access matrix
        run: |
          eval "$(sh qa/platform.sh env)"
          npx tsx qa/access/run.ts --variant "${{ matrix.variant }}" --report "$RUNNER_TEMP/access-report.json"

      # What somebody who wants more than they have can try: headers, forged cookies, a form on another site, calendar
      # links, trapped uploads, hostile text in every field, floods, and what the logs held afterwards. Last of the suites:
      # the logs it reads are those of everything above. See "Attacks" in docs/architecture.md.
      - name: Attacks
        run: |
          eval "$(sh qa/platform.sh env)"
          npx tsx qa/security/run.ts --report "$RUNNER_TEMP/attacks-report.json"

      - name: Keep the report of the attacks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attacks-${{ matrix.variant }}
          path: ${{ runner.temp }}/attacks-report.json
          if-no-files-found: ignore

      - name: Keep the report of the access matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-matrix-${{ matrix.variant }}
          path: ${{ runner.temp }}/access-report.json
          if-no-files-found: ignore

      - name: Logs of the platform
        if: always()
        run: sh qa/platform.sh logs > "$RUNNER_TEMP/platform.log" || true

      - name: Keep the logs of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-baseline-${{ matrix.variant }}-logs
          path: ${{ runner.temp }}/platform.log
          if-no-files-found: ignore

      - name: Stop the platform
        if: always()
        run: sh qa/platform.sh down

  # The production image, scanned every night: a vulnerability published since the last pull request (in Alpine, in Node,
  # in a package of the application) shows here before anybody ships it. The same scan, with the same rules, is in the
  # `docker image` job of ci.yml; this one also lists what nobody can fix yet, for information.
  image-scan:
    name: image scan (known vulnerabilities)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-qa')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: bde-network
          cache-from: type=gha,scope=qa-image
          cache-to: type=gha,mode=max,scope=qa-image

      - name: What nobody can fix yet (for information)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 image --quiet \
            --scanners vuln --severity HIGH,CRITICAL bde-network | tee "$RUNNER_TEMP/trivy-all.txt" | tail -40 || true
          { echo '### Known vulnerabilities in the image'; echo; echo '```'; tail -60 "$RUNNER_TEMP/trivy-all.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: No vulnerability that has a fix
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.76.0 image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore --exit-code 1 bde-network

  # OWASP ZAP against the platform, signed in as the owner: every night the baseline (the spider and the passive rules, what
  # every response says) and the active scan (ZAP sends attacks at every page and form it found). A pull request that
  # carries the label `full-qa` runs the baseline only. The verdict is qa/security/zap-gate.mjs: an alert of medium level
  # or above fails unless it is in qa/security/zap-accepted.json with its reason.
  zap:
    name: ZAP (${{ github.event_name == 'schedule' && 'baseline and active scan' || 'baseline' }})
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-qa')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: bde-network
          cache-from: type=gha,scope=qa-image
          cache-to: type=gha,mode=max,scope=qa-image

      - name: Start the platform with the QA dataset
        run: sh qa/platform.sh up --image bde-network --dataset small

      - name: Baseline
        run: sh qa/security/zap.sh baseline "$RUNNER_TEMP/zap-baseline"

      # The active scan changes things (it is let loose on the pages of an owner): a platform of its own, made again.
      - name: Active scan
        if: github.event_name != 'pull_request'
        run: |
          sh qa/platform.sh up --image bde-network --dataset small
          sh qa/security/zap.sh full "$RUNNER_TEMP/zap-full"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            ${{ runner.temp }}/zap-baseline/zap.html
            ${{ runner.temp }}/zap-baseline/zap.json
            ${{ runner.temp }}/zap-full/zap.html
            ${{ runner.temp }}/zap-full/zap.json
          if-no-files-found: ignore

      - name: Stop the platform
        if: always()
        run: sh qa/platform.sh down

  # Mutation check of the attacks on the PRODUCTION IMAGE: each guard they rely on is broken in a throwaway worktree, an
  # image is built from it, and the attacks must fail (qa/mutate-image.mjs). One image build per mutation, which is why it
  # runs here and not on a computer: put the label `qa-mutations` on a pull request that changes the attacks or one of the
  # guards in qa/mutations/attacks.json, or run this workflow by hand.
  mutations:
    name: mutation check of the attacks (the image)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'qa-mutations'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Break each guard, build the image, play the attacks
        env:
          MUTATION_RUN: qa/security/run.ts
        run: node qa/mutate-image.mjs qa/mutations/attacks.json

  # The journeys of the platform in the three engines people use: Chromium, Firefox and WebKit (Safari's), each in a job of its
  # own, against the real image and the QA dataset (qa/browsers; see "Browsers" in docs/architecture.md). What a page raises,
  # an exception, a console error, a violation of the content policy, a server error, fails the journey that raised it.
  # The accessibility of every page (axe, WCAG 2.2 AA) is checked in the Chromium job, and the keyboard in all three.
  browsers:
    name: browsers (${{ matrix.engine }})
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-qa')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: bde-network
          cache-from: type=gha,scope=qa-image
          cache-to: type=gha,mode=max,scope=qa-image

      - name: Start the platform with the QA dataset
        run: sh qa/platform.sh up --image bde-network

      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: Play the journeys
        run: |
          eval "$(sh qa/platform.sh env)"
          npx playwright test -c qa/browsers --project=${{ matrix.engine }}
        env:
          CI: 'true'

      # The traces and screenshots of a failure, and the report: open the trace with `npx playwright show-trace`.
      - name: Keep what a failure left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browsers-${{ matrix.engine }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

      - name: Keep the logs of the platform
        if: always()
        run: sh qa/platform.sh logs > "$RUNNER_TEMP/platform.log" || true

      - name: Keep the logs of the platform (upload)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browsers-${{ matrix.engine }}-platform-logs
          path: ${{ runner.temp }}/platform.log
          if-no-files-found: ignore

      - name: Stop the platform
        if: always()
        run: sh qa/platform.sh down

  # What the pages look like, against a reference picture of each (qa/browsers/visual.spec.ts; "Visual regression" in
  # docs/architecture.md). The references are on a branch of their own, `qa/visual-baselines`, made by the workflow
  # `qa visual references` where they are compared (the same page is not drawn pixel for pixel the same by two systems). The
  # platform's clock is the moment of the dataset (`--now`), so that nothing on a page depends on the day it is run.
  visual:
    name: visual references (Chromium)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-qa')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The branch may not exist yet: the step after this one says so, instead of the job failing here without a word.
      - name: Fetch the reference pictures
        id: references
        run: |
          if git ls-remote --exit-code --heads origin qa/visual-baselines >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch qa/visual-baselines "https://github.com/${{ github.repository }}.git" "$RUNNER_TEMP/references"
            echo "count=$(find "$RUNNER_TEMP/references" -name '*.png' | wc -l)" >> "$GITHUB_OUTPUT"
            echo "commit=$(git -C "$RUNNER_TEMP/references" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: There must be references to compare with
        run: |
          if [ "${{ steps.references.outputs.count }}" = "0" ]; then
            echo "::error::No reference pictures yet (branch qa/visual-baselines): run the workflow 'qa visual references' (Actions), or put the label 'visual-references' on this pull request, then run this job again."
            exit 1
          fi
          echo "Comparing with ${{ steps.references.outputs.count }} pictures of qa/visual-baselines@${{ steps.references.outputs.commit }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: bde-network
          cache-from: type=gha,scope=qa-image
          cache-to: type=gha,mode=max,scope=qa-image

      - name: Start the platform, with the clock of the dataset
        run: sh qa/platform.sh up --image bde-network --now 2026-10-16T12:00:00Z

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Compare the pages with their references
        run: |
          eval "$(sh qa/platform.sh env)"
          npx playwright test -c qa/browsers --project=visual
        env:
          CI: 'true'
          QA_VISUAL_DIR: ${{ runner.temp }}/references

      # For each picture that differs: the reference, the page as it is, and the difference drawn.
      - name: Keep the pictures that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-differences
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

      - name: Stop the platform
        if: always()
        run: sh qa/platform.sh down

  # How fast the pages are, and what the platform does when many people use it at once (qa/perf; "Performance and load" in
  # docs/architecture.md). Lighthouse (a pinned version, run with npx) judges the pages of a phone and of a computer against the
  # budgets of qa/perf/budgets.json; k6 (a pinned image) plays a mix of what members, validators and owners open, with 20 virtual
  # people for 40 seconds, against limits written in its script, and the memory of the application after it is looked at.
  # The numbers go to the summary of the run, and the full reports are kept.
  performance:
    name: performance and load
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-qa')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: bde-network
          cache-from: type=gha,scope=qa-image
          cache-to: type=gha,mode=max,scope=qa-image

      - name: Start the platform with the QA dataset
        run: sh qa/platform.sh up --image bde-network --now 2026-10-16T12:00:00Z

      - name: Install the browser (Lighthouse drives the one of Playwright)
        run: npx playwright install --with-deps chromium

      - name: Lighthouse, on a phone and on a computer
        run: |
          eval "$(sh qa/platform.sh env)"
          npx tsx qa/perf/lighthouse.ts

      # Both are always played: a page over its budget must not hide what the load shows.
      - name: Load, with k6
        if: always()
        run: |
          eval "$(sh qa/platform.sh env)"
          npx tsx qa/perf/load.ts --vus 20 --duration 40s

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: lighthouse-reports
          if-no-files-found: ignore

      - name: Keep the logs of the platform
        if: always()
        run: sh qa/platform.sh logs > "$RUNNER_TEMP/platform.log" || true

      - name: Keep the logs of the platform (upload)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-platform-logs
          path: ${{ runner.temp }}/platform.log
          if-no-files-found: ignore

      - name: Stop the platform
        if: always()
        run: sh qa/platform.sh down

  # What happens to the platform when what it stands on goes away (qa/resilience; see "Resilience" in docs/architecture.md): the
  # database stopped, frozen and killed in the middle of writes, the application stopped and killed in the middle of writes, and a
  # webhook that accepts the connection and never answers. The platform is made with that webhook; the suites stop and kill its
  # containers, so it is theirs alone.
  resilience:
    name: resilience
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-qa')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: bde-network
          cache-from: type=gha,scope=qa-image
          cache-to: type=gha,mode=max,scope=qa-image

      - name: Start the platform, its notifications going to a webhook that will not answer
        run: sh qa/platform.sh up --image bde-network --webhook https://qa-hang:8443/hook

      - name: Take the database and the application away, and the webhook
        run: |
          eval "$(sh qa/platform.sh env)"
          npx tsx qa/resilience/run.ts --report resilience-report.json

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-report
          path: resilience-report.json
          if-no-files-found: ignore

      - name: Keep the logs of the platform
        if: always()
        run: sh qa/platform.sh logs > "$RUNNER_TEMP/platform.log" || true

      - name: Keep the logs of the platform (upload)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-platform-logs
          path: ${{ runner.temp }}/platform.log
          if-no-files-found: ignore

      - name: Stop the platform
        if: always()
        run: sh qa/platform.sh down

  # The updates an operator makes (qa/upgrade; see "Updates" in docs/architecture.md): a platform of an old version with data in it,
  # the folder moved to the version under test, `docker compose up -d`, then a backup and its restore and the way back to the old
  # version. One job per version to leave: 1.0.0 was never published as an image, so its job builds it from its tag.
  upgrade:
    name: update from ${{ matrix.from }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-qa')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        from: ['1.0.0', '1.1.0', '1.2.0']
    steps:
      - uses: actions/checkout@v4
        with:
          # the folders of the old versions are worktrees of their tags
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The name `docker-compose.build.yml` gives the image built from the folder.
      - name: Build the image of the version under test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: bde-network:local
          cache-from: type=gha,scope=qa-image
          cache-to: type=gha,mode=max,scope=qa-image

      - name: Update from ${{ matrix.from }}, back up, restore, go back
        run: npx tsx qa/upgrade/run.ts --from ${{ matrix.from }} --report upgrade-report.json

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-report-${{ matrix.from }}
          path: upgrade-report.json
          if-no-files-found: ignore

  # A year and a half of the reminder loop on a real PostgreSQL with the QA dataset (qa/longtime; see "Long time" in
  # docs/architecture.md). No image: the loop is called with each instant it would look at, so it takes minutes, not months.
  longtime:
    name: long time
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-qa')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bde
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bde -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://bde:ci-password@127.0.0.1:5432/postgres
      QA_LONGTIME: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Play a year and a half of the reminder loop, and the school year at every boundary
        run: npx vitest run qa/longtime

  # Mutation testing of the rules that decide who may do what and what is accepted (qa/mutation; see "Mutation testing" in
  # docs/architecture.md): Stryker changes the code one operator at a time and the tests must notice. It is not a dependency of the
  # project (hundreds of packages the platform never ships): it is installed here with --no-save, at the version written here.
  mutation-testing:
    name: mutation testing
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-qa')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --legacy-peer-deps: npm 10 (the one of Node 22) stops with "Cannot read properties of null (reading 'edgesOut')" on the
      # overrides of package.json otherwise; the one peer Stryker asks for, vitest, is already in the project.
      - name: Install Stryker (not part of the project's dependencies)
        run: npm install --no-save --legacy-peer-deps @stryker-mutator/core@10.0.0 @stryker-mutator/vitest-runner@10.0.0

      - name: Change the rules one operator at a time, and see that the tests notice
        run: npx stryker run qa/mutation/stryker.config.json

      # Whatever the score, the table and the mutations nobody noticed are in the summary of the job.
      - name: Summary
        if: always()
        run: npx tsx qa/mutation/summary-run.ts

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-report
          if-no-files-found: ignore
