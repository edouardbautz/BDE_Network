name: documentation screenshots (temporary)

# Takes the screenshots of the documentation from the production image (scripts/docs-screenshots.mjs) and keeps them as an
# artifact, because the script builds the image and drives a browser: not something to run on a computer. Temporary: it lives on
# the branch of the redesign and goes away before it is merged.
on:
  push:
    branches: [feat/design-galets-dashboard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --no-audit --no-fund puppeteer-core@25.12.0

      - name: Take the screenshots, in French and in English
        run: CHROME_PATH=/usr/bin/google-chrome node scripts/docs-screenshots.mjs

      - name: Keep the pictures
        uses: actions/upload-artifact@v4
        with:
          name: documentation-images
          path: docs/images
          if-no-files-found: error
