name: codeql

# CodeQL reads the code itself (TypeScript, and the workflows of this repository: an expression injection in a workflow
# is a way into the secrets of CI) for the weaknesses that rules about a pattern cannot see: a request that reaches a
# query, a path or a redirect without being checked, a stored script, a secret that ends up in a log...
#
# The alerts go to the Security tab as usual; scripts/sarif-gate.mjs makes the HIGH and CRITICAL ones (and anything of
# level `error`) stop a pull request. Whoever has an alert decides: fix it, or, if it is a false positive, dismiss it in the
# Security tab with the reason (that is a decision of a person, and it stays written there).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        id: analyze
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/sarif-${{ matrix.language }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: No blocking alert (HIGH, CRITICAL, or an error)
        run: node scripts/sarif-gate.mjs "${{ runner.temp }}/sarif-${{ matrix.language }}"
