name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job reads the code and nothing else: the token is limited to that, whatever the default of the repository is.
permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Once is enough (the tree is identical on both systems). Fails on a new
      # high/critical advisory; accepted ones are in scripts/audit-allowlist.json.
      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm run audit:prod

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Windows runs the tests as they are; Ubuntu runs them once more through V8 coverage, which enforces the floors of
      # coverage-thresholds.json (a ratchet: see "Quality campaign" in docs/architecture.md).
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: npm run test

      - name: Test, with the coverage floors
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      # The tests hold on any computer, whatever its time zone: the runners are in UTC, a developer's is not, and a test that read a
      # date in the zone of the machine passed here and failed there (event-repeat-rules.test.ts). One zone ahead of UTC across the
      # date line and one behind, with the clock changes of the two hemispheres.
      - name: Test, in two other time zones
        if: matrix.os == 'ubuntu-latest'
        run: |
          for zone in Pacific/Auckland America/Los_Angeles; do
            echo "::group::$zone"
            TZ="$zone" npm run test || exit 1
            echo "::endgroup::"
          done

      - name: Coverage report
        if: always() && matrix.os == 'ubuntu-latest' && hashFiles('coverage/coverage-summary.json') != ''
        run: node scripts/coverage-report.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # The documentation is a product of its own: internal links and anchors, images' alternative text, French and
  # English pages that are twins (scripts/check-docs.mjs), Markdown style (markdownlint) and layout (Prettier).
  # Required on `main`. External links are checked every week by links.yml: a network hiccup must not block a
  # pull request.
  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No script (no Prisma client to generate): the checks only read Markdown.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Internal links, anchors, images and FR/EN twins
        run: npm run docs:check

      - name: Markdown style
        run: npm run lint:md

      - name: Markdown layout
        run: npx prettier --check "**/*.md"

  # The production image is what operators actually run: it is built once (here), then tried at the same time by the jobs below,
  # which load it instead of building it again: started against a real PostgreSQL (docker checks), driven by the browser tests
  # (browser tests, four shards that each make a platform of their own), and brought up by Docker Compose (docker compose). The job
  # `docker image` only says whether all of them passed: it is the check that `main` requires.
  docker-build:
    name: docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: |
          docker build -t bde-network .
          docker images bde-network --format 'Image size: {{.Size}}'

      # The build file of Docker Compose builds the same image (same Dockerfile, same folder: the layers are already there).
      - name: The build file of Docker Compose builds it too
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
          COMPOSE_PATH_SEPARATOR: ':'
        run: docker compose build app

      # The image goes to the jobs that use it as a file. Both names are saved, in one archive (the layers once).
      - name: Keep the image for the other jobs
        run: docker save bde-network bde-network:local | gzip -1 > "$RUNNER_TEMP/image.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar.gz
          compression-level: 0
          retention-days: 1

  docker-checks:
    name: docker checks
    needs: docker-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bde
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: bde_network
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bde -d bde_network"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/image.tar.gz"

      # No fixable HIGH or CRITICAL vulnerability in what the image ships (its operating system, Node, the packages of the
      # application). A vulnerability that has no fix yet does not stop anybody (--ignore-unfixed), and the few that are
      # accepted are in .trivyignore with their reason. See "Quality campaign" in docs/architecture.md.
      - name: Scan the image for known vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.76.0 image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore --exit-code 1 bde-network

      - name: Start it against PostgreSQL
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL='postgresql://bde:ci-password@127.0.0.1:5432/bde_network?schema=public' \
            -e AUTH_SECRET='ci-only-secret-not-used-anywhere-else-0123456789' \
            -e FORTYTWO_CLIENT_ID=ci \
            -e FORTYTWO_CLIENT_SECRET=ci \
            bde-network

      - name: Wait for the health check (migrations run before the server starts)
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Check the security headers
        run: |
          headers="$(curl -sI http://127.0.0.1:3000/fr)"
          echo "$headers"
          for header in content-security-policy x-frame-options x-content-type-options; do
            echo "$headers" | grep -qi "^$header:" || { echo "Missing header: $header"; exit 1; }
          done
          if echo "$headers" | grep -qi '^x-powered-by:'; then echo "X-Powered-By must not be sent"; exit 1; fi

      # The update: a copy of the database is made before migrations are applied, put back when one fails, and a database
      # or a stack that does not fit the image is explained (docker/start.mjs). Against the real image and a real PostgreSQL.
      - name: A safe update, against the real image
        run: sh ./e2e/safe-update.sh bde-network

      # A problem the operator can fix must be explained in the browser, not looped on: the container
      # stays up, answers 503 with a page naming the problem (and no secret), and never restarts by itself.
      - name: A broken .env is explained, not looped on
        run: |
          # bde.config.yml of the image is the unfilled template, which opens the installer: give it a real owner
          sed 's/votre-login-42/ci-owner/' bde.config.yml > "$RUNNER_TEMP/filled-config.yml"
          docker run -d --name broken-env --network host -e PORT=3001 \
            -v "$RUNNER_TEMP/filled-config.yml:/app/bde.config.yml:ro" \
            -e DATABASE_URL='postgresql://bde:ci-password@127.0.0.1:5432/bde_network?schema=public' \
            -e FORTYTWO_CLIENT_ID= -e FORTYTWO_CLIENT_SECRET=ci-client-secret \
            bde-network
          for attempt in $(seq 1 30); do
            code="$(curl -s -o "$RUNNER_TEMP/page.html" -w '%{http_code}' http://127.0.0.1:3001/ || true)"
            [ "$code" = 503 ] && break
            sleep 2
          done
          [ "$code" = 503 ] || { docker logs broken-env; exit 1; }
          grep -q '<code>FORTYTWO_CLIENT_ID</code>' "$RUNNER_TEMP/page.html"
          curl -s -H 'Accept-Language: en' http://127.0.0.1:3001/ | grep -q 'needs fixing'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/health)" = 503 ]
          ! grep -q 'ci-client-secret' "$RUNNER_TEMP/page.html"
          [ "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' broken-env)" = "true 0" ]
          docker rm -f broken-env

      - name: A refused database password is explained, not looped on
        run: |
          docker run -d --name broken-db --network host -e PORT=3002 \
            -e DATABASE_URL='postgresql://bde:wrong-password@127.0.0.1:5432/bde_network?schema=public' \
            -e AUTH_SECRET='ci-only-secret-not-used-anywhere-else-0123456789' \
            -e FORTYTWO_CLIENT_ID=ci -e FORTYTWO_CLIENT_SECRET=ci \
            bde-network
          for attempt in $(seq 1 30); do
            code="$(curl -s -o "$RUNNER_TEMP/page.html" -w '%{http_code}' http://127.0.0.1:3002/ || true)"
            [ "$code" = 503 ] && break
            sleep 2
          done
          [ "$code" = 503 ] || { docker logs broken-db; exit 1; }
          grep -q 'refuse la connexion' "$RUNNER_TEMP/page.html"
          grep -q '<code>P1000</code>' "$RUNNER_TEMP/page.html"
          ! grep -q 'wrong-password' "$RUNNER_TEMP/page.html"
          ! docker logs broken-db 2>&1 | grep -q 'wrong-password'
          [ "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' broken-db)" = "true 0" ]
          docker rm -f broken-db

      - name: Show the logs
        if: always()
        run: docker logs app

  # The installer, in a real browser, against the real image: puppeteer-core drives the Chrome of the runner and
  # e2e/mock-fortytwo.mjs stands in for the 42 API. Each shard has its own PostgreSQL and its own platform (e2e/ci-browser.sh says
  # which scripts it plays), so the shards run at the same time: together they take what the longest of them takes. Nothing
  # secret may be in a log or in clear in the database afterwards; the scripts forge session cookies with @auth/core, at the
  # version of the lockfile.
  docker-browser:
    name: browser tests (shard ${{ matrix.shard }})
    needs: docker-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bde
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: bde_network
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bde -d bde_network"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/image.tar.gz"

      - name: The installer, then the scripts of the shard, in a real browser
        run: sh e2e/ci-browser.sh ${{ matrix.shard }}

      # What the platform itself said while the browser tests ran (the tests only see the browser's side of a failure).
      - name: The log of the platform, when a browser test failed
        if: failure()
        run: docker logs installer 2>&1 | tail -300 || true

      - name: Screenshots of the installer and the settings page
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-screenshots-${{ matrix.shard }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn

  # Docker Compose, from the folder: no image of the release exists yet when a pull request is tested, so it builds its own.
  docker-compose:
    name: docker compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # (The two steps below build the image from the folder, through docker-compose.build.yml, because the image of the
      # release does not exist yet when a pull request is tested. The published image is tried by release.yml.)
      # The real docker-compose.yml, without any .env: the platform makes its own keys (the `secrets`
      # volume), the database starts with a generated password, the migrations apply, and, with nothing decided,
      # it opens the installer: the code is in the logs, the page asks for it, the rest of the site is closed.
      - name: A fresh installation needs no .env
        env:
          APP_PORT: '3100'
          COMPOSE_PROJECT_NAME: ci-fresh
          COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
          COMPOSE_PATH_SEPARATOR: ':'
        run: |
          test ! -e .env
          docker compose up -d --build
          for attempt in $(seq 1 45); do
            code="$(curl -s -o "$RUNNER_TEMP/fresh.html" -w '%{http_code}' http://127.0.0.1:3100/fr/setup || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ] || { docker compose logs; exit 1; }
          grep -q "Entrez le code d'installation" "$RUNNER_TEMP/fresh.html"
          docker compose logs app | grep -q 'Code d.installation / Code : [A-Z0-9]\{4\}-[A-Z0-9]\{4\}'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/fr)" = 307 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/auth/session)" = 503 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/health)" = 200 ]
          docker compose exec -T app ls /secrets | sort | tr '\n' ' ' | grep -q 'auth_secret postgres_password settings_key'
          docker compose down -v

      # An installation that predates the settings table (a .env and a filled bde.config.yml): the first start
      # copies them into the database with the secrets sealed, and the platform then runs without either file.
      - name: An existing installation is imported, then runs from its database
        env:
          APP_PORT: '3101'
          COMPOSE_PROJECT_NAME: ci-import
          COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
          COMPOSE_PATH_SEPARATOR: ':'
        run: |
          sed -i 's/votre-login-42/ci-owner/' bde.config.yml
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-legacy-password
          AUTH_SECRET=ci-legacy-session-secret-0123456789-abcdefghij
          FORTYTWO_CLIENT_ID=ci-uid
          FORTYTWO_CLIENT_SECRET=ci-sealed-42-secret
          EOF
          wait_healthy() {
            for attempt in $(seq 1 45); do
              curl -fsS http://127.0.0.1:3101/api/health >/dev/null && return 0
              sleep 2
            done
            docker compose logs
            return 1
          }
          docker compose up -d --build
          wait_healthy
          docker compose logs app | grep -q 'copiés dans la base de données'
          [ "$(docker compose exec -T postgres psql -U bde -d bde_network -tAc "SELECT secrets LIKE '%ci-sealed-42-secret%' FROM \"PlatformSettings\"")" = f ]
          # the files no longer matter: remove .env, break bde.config.yml, restart
          rm .env
          echo 'owners: [broken]' > bde.config.yml
          docker compose up -d --force-recreate app
          wait_healthy
          docker compose logs app --since 60s | grep -q 'Ready'
          ! docker compose logs app --since 60s | grep -q 'copiés dans la base de données'
          docker compose down -v
          git checkout bde.config.yml

  # The check that `main` requires for the image: it passes when the build, the checks, the browser tests and the compose flows did.
  docker:
    name: docker image
    if: always()
    needs: [docker-build, docker-checks, docker-browser, docker-compose]
    runs-on: ubuntu-latest

    steps:
      - name: Did every job of the image pass
        run: |
          echo "build: ${{ needs.docker-build.result }}, checks: ${{ needs.docker-checks.result }}, browser tests: ${{ needs.docker-browser.result }}, compose: ${{ needs.docker-compose.result }}"
          [ "${{ needs.docker-build.result }}" = success ] && [ "${{ needs.docker-checks.result }}" = success ] && [ "${{ needs.docker-browser.result }}" = success ] && [ "${{ needs.docker-compose.result }}" = success ]

  # Applies the real migration files to a real PostgreSQL: the custom-roles data migration is
  # tested with legacy accounts (src/test/migrations), and the migrations must leave exactly the
  # schema prisma/schema.prisma describes (no drift).
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bde
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: bde_network
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bde -d bde_network"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bde:ci-password@127.0.0.1:5432/bde_network?schema=public
      MIGRATION_TEST_DATABASE_URL: postgresql://bde:ci-password@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the data migrations on legacy accounts
        run: npx vitest run src/test/migrations

      # The QA dataset and its invariants (qa/), against this same real PostgreSQL: every constraint of the migrations
      # must accept the dataset, and every invariant must see the corruption it is meant to see.
      - name: Test the QA dataset and the invariants on a real database
        run: npx vitest run qa

      # The storage of the notification templates (SERIALIZABLE transactions, the guards of the migration, two saves at once): what a
      # fake database cannot say. `scripts/workflows.test.ts` fails for any test that needs a database and that no job runs.
      - name: Test the storage of the notification templates on a real database
        run: npx vitest run src/lib/notifications/templates/service.db.test.ts

      # The same again in two other time zones of the machine that runs the tests: the columns hold UTC, and `pg` reads a `timestamp`
      # in the zone of the machine (see "Conventions" in docs/architecture.md).
      - name: The same, in two other time zones
        run: |
          for zone in Pacific/Auckland America/Los_Angeles; do
            echo "::group::$zone"
            TZ="$zone" npx vitest run src/test/migrations qa src/lib/notifications/templates/service.db.test.ts || exit 1
            echo "::endgroup::"
          done

      - name: Apply every migration to an empty database
        run: npx prisma migrate deploy

      - name: Check the migrations leave no drift from schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
