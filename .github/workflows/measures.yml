name: measures

# The numbers of the optimisation campaign (qa/optim; see "Measures of the optimisation campaign" in docs/architecture.md): the
# image, every page (time on the server, weight of the scripts), the statements each page sends to PostgreSQL, the tables read
# in full, the restart, the memory at rest and under load, and the growth of the data, on the QA dataset (two school years) and
# on a large one (five years, five times the members). The runner is close to a small server (2 CPUs, 7 GiB). It judges nothing:
# the JSON of each run is kept as an artifact, and the budgets that hold the gains are those of the other jobs. Run it by hand
# (Actions → measures → Run workflow) to take the "before" of a change; it also runs every night and on a pull request that
# touches the tooling.
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'qa/optim/**'
      - 'qa/platform.sh'
      - '.github/workflows/measures.yml'

permissions:
  contents: read

jobs:
  measure:
    name: measures (${{ matrix.dataset }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dataset: [full, large]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: bde-network
          cache-from: type=gha,scope=qa-image
          cache-to: type=gha,mode=max,scope=qa-image

      - name: Start the platform with the dataset
        run: sh qa/platform.sh up --image bde-network --stats --dataset ${{ matrix.dataset }} --now 2026-10-16T12:00:00Z

      - name: Measure
        run: |
          eval "$(sh qa/platform.sh env)"
          mkdir -p optim
          npx tsx qa/optim/measure.ts --label "${{ matrix.dataset }} dataset" --image bde-network --out "optim/${{ matrix.dataset }}.json"

      # The speed of what is drawn on a phone with a slow network and processor (Lighthouse: LCP, TBT, CLS and the weight): taken
      # on the QA dataset only. The budgets are those of the performance job of qa.yml; here a breach is a number, not a failure.
      - name: Install the browser (Lighthouse drives the one of Playwright)
        if: matrix.dataset == 'full'
        run: npx playwright install --with-deps chromium

      - name: Core Web Vitals, on a phone and on a computer
        if: matrix.dataset == 'full'
        continue-on-error: true
        env:
          LIGHTHOUSE_REPORTS: optim/lighthouse
        run: |
          eval "$(sh qa/platform.sh env)"
          npx tsx qa/perf/lighthouse.ts

      - name: Keep the measures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measures-${{ matrix.dataset }}
          path: optim
          if-no-files-found: ignore

      - name: Keep the logs of the platform
        if: failure()
        run: sh qa/platform.sh logs | tail -200

      - name: Stop the platform
        if: always()
        run: sh qa/platform.sh down
