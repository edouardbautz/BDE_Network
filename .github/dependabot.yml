# One weekly batch of updates instead of one pull request per package, minor and patch only:
# a major version is never proposed (see `ignore`) and is taken on by hand, on its own.
# Security updates are raised by GitHub as soon as an advisory is published,
# independently of this schedule and of `ignore`.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Major versions are handled by hand, in a pull request of their own.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5
    groups:
      # These pairs must move together (see "Dependencies" in docs/contributing-guide.md).
      next:
        patterns: ['next', 'eslint-config-next']
      next-auth:
        patterns: ['next-auth', '@auth/core']
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Major versions are handled by hand, in a pull request of their own.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Major versions are handled by hand, in a pull request of their own.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Major versions are handled by hand, in a pull request of their own.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      docker-compose:
        patterns: ['*']
